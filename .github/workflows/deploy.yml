name: Deploy image + dashboard

# One push = full deploy:
#   1. Build the arm64 image and push to ECR :latest.
#      (The wodify-custom-mcp-deploy stack's EventBridge rule sees the push
#      and force-redeploys the ECS service automatically — no action here.)
#   2. Deploy the CloudWatch usage dashboard as a CloudFormation stack, so
#      dashboard changes ride the same commit as the code that emits the
#      log fields it queries.
#
# Auth: OIDC role-assume against the shared deploy role. The role's trust
# policy already covers repo:WodifyLLC/*:*. Its permission policy needs the
# ECR-push + CloudWatch-dashboard actions documented in infra/IAM-CI-SETUP.md
# before this workflow can succeed.

on:
  push:
    branches: [wodify-patched]
    # Don't burn CI minutes on docs-only changes.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 212972612334.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPO: productboard-mcp
  DASHBOARD_STACK: productboard-mcp-dashboard

jobs:
  deploy:
    # ubuntu-latest + QEMU cross-builds the arm64 image. If the org has arm64
    # hosted runners enabled, switching to `ubuntu-24.04-arm` makes the build
    # native and several times faster.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::212972612334:role/wodify-github-custom-mcp-deploy
          aws-region: us-east-1

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push arm64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f Dockerfile.arm64 \
            -t "$ECR_REGISTRY/$ECR_REPO:latest" \
            -t "$ECR_REGISTRY/$ECR_REPO:sha-${GITHUB_SHA::12}" \
            --push .
          echo "Pushed :latest and :sha-${GITHUB_SHA::12}. ECS auto-redeploy will pick it up."

      - name: Deploy usage dashboard (CloudFormation)
        run: |
          node scripts/build-dashboard-stack.mjs
          aws cloudformation deploy \
            --stack-name "$DASHBOARD_STACK" \
            --template-file infra/cloudwatch-usage-dashboard.cfn.json \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset
          echo "Dashboard stack synced."

      - name: Summary
        run: |
          {
            echo "## Deploy complete"
            echo "- Image: \`$ECR_REGISTRY/$ECR_REPO:latest\` (+ \`:sha-${GITHUB_SHA::12}\`)"
            echo "- ECS: auto-redeploy triggered by the ECR push (EventBridge)"
            echo "- Dashboard: stack \`$DASHBOARD_STACK\` synced"
            echo "- [Open dashboard](https://us-east-1.console.aws.amazon.com/cloudwatch/home?region=us-east-1#dashboards/dashboard/Productboard-MCP-Usage-Monitoring)"
          } >> "$GITHUB_STEP_SUMMARY"
